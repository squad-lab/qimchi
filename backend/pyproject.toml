[project]
name = "qimchi-api"
version = "0.4.1"
description = "Plot your spicy quantum measurements with ease"
authors = [
  { name = "Spandan Anupam", email = "s.anupam@fz-juelich.de" },
  { name = "Jyotirmaya Shivottam", email = "jyotirmaya.shivottam@niser.ac.in" },
  { name = "Lino Visser", email = "l.visser@fz-juelich.de" },
]
license = "AGPL-3.0-or-later"
keywords = ["quantum", "plotter", "plotly", "fastapi", "react"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.135.0",
    "gunicorn>=25.3.0",
    "kaleido>=1.2.0",
    "numpy>=2.4.0",
    "pip>=26.0.0",
    "plotly>=6.6.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.2.0",
    "qcodes>=0.56.0",
    "rich>=14.3.0",
    "scikit-image>=0.26.0",
    "setuptools>=82.0.0",
    "scipy>=1.17.0",
    "watchdog>=6.0.0",
    "websockets>=16.0.0",
    "uvicorn>=0.42.0",
    "concurrent-log-handler>=0.9.29",
    "portalocker>=3.2.0",
    "xarray>=2026.2.0",
    "zarr>=3.1.6,<4",
    # "qcutils",  # Handled via .bat installer - can be pinned to GitLab source
]

[project.optional-dependencies]
dev = [
    "wheel>=0.46.0",
    "ruff>=0.15.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
]
test = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
]
datasets = [
    "netcdf4>=1.7.4",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "numcodecs>=0.16.5",
    "polars>=1.39.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
]
test = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
]
datasets = [
    "netcdf4>=1.7.4",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "numcodecs>=0.16.5",
    "polars>=1.39.3",
]

[tool.uv]
package = true

[project.urls]
homepage = "https://gitlab.com/squad-lab/qimchi"
documentation = "https://qimchi.squad-lab.org"
repository = "https://gitlab.com/squad-lab/qimchi"
