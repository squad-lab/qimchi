services:
  backend:
    build: .
    container_name: qimchi_backend
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      ENABLE_KALEIDO_WARMUP: "${ENABLE_KALEIDO_WARMUP:-0}"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
