# Alembic config for CLI use during development, e.g.:
#   uv run alembic revision --autogenerate -m "add notes"
#   uv run alembic upgrade head
# The running app does NOT use this file -- it configures Alembic
# programmatically in api/shared/db.py::run_migrations (so no ini needs to be
# bundled with the frozen desktop app). The DB URL is resolved from
# api.shared.paths.db_path() when not overridden here.

[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url is intentionally left blank; env.py falls back to db_path().
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
