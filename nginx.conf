server {
    listen 8001;
    server_name localhost;

    # Proxy API routes to FastAPI (these need to come first to avoid conflicts with SPA)
    location ~ ^/(health|plot|transform-plot|library|live-measurements|load-notes|save-notes|apply-filters|apply-sliders|export-plot-images|download|load|dataset-status|docs|redoc|openapi\.json) {
        proxy_pass http://127.0.0.1:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Handle static assets with proper caching (before SPA fallback)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /app/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Serve static files from React build (SPA fallback for all other routes)
    location / {
        root /app/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
}
