<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/qimchi-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@100..800&display=swap"
      rel="stylesheet"
    />

    <title>Qimchi v0.7.0</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- MathJax config + loader so Plotly's typesetMath can find a typesetter
        Load before the React bundle so plots that render on mount get typeset. -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ],
          packages: ["base", "ams"],
        },
        options: {
          skipHtmlTags: ["script", "noscript", "style", "textarea", "pre"],
        },
      };
    </script>
    <!-- Plotly renders its math into SVG. Use MathJax's Fira-specific combined
      component so equations match the application's sans-serif typography
      without first downloading the default New Computer Modern font. -->
    <script src="https://cdn.jsdelivr.net/npm/@mathjax/mathjax-fira-font@4.1.3/tex-mml-svg-mathjax-fira.js"></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
