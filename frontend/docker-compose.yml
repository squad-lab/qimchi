version: "3.9"

services:
  frontend:
    container_name: qimchi_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
    build:
      context: .
      args:
        VITE_PROD_BACKEND_HOST: ${VITE_PROD_BACKEND_HOST:-localhost}
        VITE_PROD_BACKEND_PORT: ${VITE_PROD_BACKEND_PORT:-8000}
        VITE_PROD_BACKEND_URL: ${VITE_PROD_BACKEND_URL:-}
        VITE_PROD_BACKEND_WS: ${VITE_PROD_BACKEND_WS:-}
    networks:
      - qimchi-net

networks:
  qimchi-net:
    external: true
