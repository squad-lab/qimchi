image: "python:3.13"
variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_DRIVER: "overlay2"
  CI_BUILD_ARCHS: linux/amd64 #, linux/arm64
stages:
  - auto_tag_version
  - build
  - release

auto_tag_version:
  stage: auto_tag_version
  image: python:3.13-alpine
  before_script:
    - apk add --no-cache git
    - pip3 install toml --break-system-packages
    - git config --global user.name "Janitor"
    - git config --global user.email "squad@fz-juelich.de"
    - git remote set-url origin https://squad_janitor:$CI_FORMAT@$CI_SERVER_HOST/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME
    - git fetch
    - git checkout $CI_COMMIT_REF_NAME
    - git reset --hard origin/$CI_COMMIT_REF_NAME
    - git pull --rebase
  script:
    # Extract current version from pyproject.toml
    - |
      python3 << 'EOF'
      import toml
      data = toml.load('backend/pyproject.toml')
      version = data['project']['version']
      with open('current_version.txt', 'w') as f:
          f.write(version)
      print(f"Current version: {version}")
      EOF
    - export CURRENT_VERSION=$(cat current_version.txt)
    - echo "Current version in pyproject.toml is v$CURRENT_VERSION"

    # Check if this version tag already exists
    - git fetch --tags
    - |
      if git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; then
        echo "Tag v$CURRENT_VERSION already exists, skipping tag creation"
        exit 0
      fi

    # Check if version line was changed in this commit
    - |
      # Check if this is the first commit (no parent)
      if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
        echo "First commit detected - creating initial tag v$CURRENT_VERSION"
        git tag -a "v$CURRENT_VERSION" -m "Release version $CURRENT_VERSION"
        git push origin "v$CURRENT_VERSION"
        echo "Successfully created initial tag v$CURRENT_VERSION"
        exit 0
      fi

      # Check if version line was changed in this commit
      if git diff HEAD~1 HEAD -- backend/pyproject.toml | grep -E '^\+[[:space:]]*version[[:space:]]*='; then
        echo "Version was updated in this commit, creating tag v$CURRENT_VERSION"

        # Create and push the tag
        git tag -a "v$CURRENT_VERSION" -m "Release version $CURRENT_VERSION"
        git push origin "v$CURRENT_VERSION"

        echo "Successfully created and pushed tag v$CURRENT_VERSION"
      else
        echo "Version line was not changed in this commit, skipping tag creation"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  #     changes:
  #       - backend/pyproject.toml
  # allow_failure: false

# Cut a PREVIEW release from the `preview` branch: vX.Y.Z-rc.N, where N is the
# next unused rc for the version currently in pyproject.toml.
#
# Manual on purpose. Each tag fans out to three platform builds, and macOS runs
# on GitLab's SaaS macOS runner (billed at a higher multiplier) -- auto-tagging
# every push to preview would burn minutes on commits nobody wants to test.
tag_preview:
  stage: auto_tag_version
  image: python:3.13-alpine
  before_script:
    - apk add --no-cache git
    - pip3 install toml --break-system-packages
    - git config --global user.name "Janitor"
    - git config --global user.email "squad@fz-juelich.de"
    - git remote set-url origin https://squad_janitor:$CI_FORMAT@$CI_SERVER_HOST/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME
    - git fetch --tags
  script:
    - |
      python3 << 'EOF'
      import toml
      data = toml.load('backend/pyproject.toml')
      with open('current_version.txt', 'w') as f:
          f.write(data['project']['version'])
      EOF
    - export CURRENT_VERSION=$(cat current_version.txt)
    - |
      # Highest existing rc for this version, then +1. Sorted numerically so
      # rc.10 beats rc.9 (a plain sort would not).
      NEXT=$(git tag -l "v${CURRENT_VERSION}-rc.*" \
        | sed -E "s/.*-rc\.([0-9]+)$/\1/" \
        | sort -n | tail -1)
      NEXT=$(( ${NEXT:-0} + 1 ))
      PREVIEW_TAG="v${CURRENT_VERSION}-rc.${NEXT}"
      echo "Creating preview tag $PREVIEW_TAG"
      git tag -a "$PREVIEW_TAG" -m "Preview release $PREVIEW_TAG"
      git push origin "$PREVIEW_TAG"
      echo "Pushed $PREVIEW_TAG -- builds + a preview release will follow."
  rules:
    - if: $CI_COMMIT_BRANCH == "preview"
      when: manual
      allow_failure: true

docker:
  image: jonoh/docker-buildx-qemu
  stage: build
  tags:
    - saas-linux-2xlarge-amd64
  services:
    - docker:28-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --driver docker-container --use
    - docker buildx inspect --bootstrap
  script:
    - VERSION=$(grep '^[[:space:]]*version[[:space:]]*=' backend/pyproject.toml | sed -E 's/.*version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/')
    - update-binfmts --enable
    # Preview (-rc) tags publish a VERSIONED image only. `:latest` must keep
    # pointing at the newest stable, or `docker pull qimchi` would silently
    # hand people a preview build.
    - |
      TAG_ARGS="-t $CI_REGISTRY/squad-lab/qimchi:$VERSION"
      case "$CI_COMMIT_TAG" in
        *-rc.*) echo "Preview tag $CI_COMMIT_TAG -- leaving :latest on the stable image" ;;
        *)      TAG_ARGS="$TAG_ARGS -t $CI_REGISTRY/squad-lab/qimchi:latest" ;;
      esac
      echo "Image tags: $TAG_ARGS"
      docker buildx build --platform $CI_BUILD_ARCHS --progress plain --pull $TAG_ARGS --push .
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: on_success
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
      when: on_success

# Builds the self-contained Windows desktop app (PyInstaller + pywebview) via
# build_local.ps1 -- a single qimchi.exe that bundles the backend and serves the
# built SPA in a native window. Replaces the old qimchi.bat-wrapper exe.
build-windows:
  stage: build
  tags:
    - windows
  before_script:
    # Inno Setup 6 -- builds the Windows installer after PyInstaller.
    # The custom Windows container may not have Chocolatey preinstalled.
    - |
      if (!(Get-Command choco -ErrorAction SilentlyContinue)) {
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
        $env:Path = "$env:ProgramData\chocolatey\bin;$env:Path"
      }
    - choco install innosetup --yes --no-progress
    - $env:Path = "$env:ProgramFiles\Inno Setup 6;$env:Path"
    # uv manages Python 3.13 + all backend deps.
    - powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
    - $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
    # The runner's preinstalled Node is 21.7.3, which Vite 8/rolldown reject
    # (engines: ^20.19 || >=22.12). On 21.x npm SKIPS rolldown's native binding
    # and `vite build` crashes. Pin a supported Node, fetched via preinstalled curl.
    - $nodeVer = "22.12.0"
    - curl.exe -fsSL -o "$env:TEMP\node.zip" "https://nodejs.org/dist/v$nodeVer/node-v$nodeVer-win-x64.zip"
    - Expand-Archive "$env:TEMP\node.zip" -DestinationPath "$env:CI_PROJECT_DIR\.node" -Force
    - $nodeExe = Get-ChildItem -Path "$env:CI_PROJECT_DIR\.node" -Recurse -Filter node.exe | Select-Object -First 1
    - if (!$nodeExe) { throw "Downloaded Node archive did not contain node.exe" }
    - $env:Path = "$($nodeExe.DirectoryName);$env:Path"
    - uv --version
    - node --version
    - npm --version
    # Verify Inno Setup is on PATH. Don't run `ISCC.exe /?` -- it prints its
    # usage banner and exits 1 (no script file given), which the PowerShell
    # executor treats as a failed step.
    - (Get-Command ISCC.exe).Source
  script:
    - $VERSION = (Select-String -Path "backend/pyproject.toml" -Pattern 'version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
    - echo "Building Qimchi v$VERSION (pywebview desktop) for Windows"
    # build_local.ps1 handles everything:
    #   1. Frontend build (npm)
    #   2. Backend staging
    #   3. fd.exe download → vendor/fd-windows/fd.exe
    #   4. backend/.venv setup (datasets extra + PyInstaller + pywebview + pythonnet)
    #   5. PyInstaller onedir build → packaging/build/qimchi/
    #   6. Inno Setup installer → packaging/build/qimchi-setup.exe
    - ./build_local.ps1
    - if (!(Test-Path "packaging/build/qimchi-setup.exe")) { throw "Installer build failed" }
    - $installerSize = (Get-Item "packaging/build/qimchi-setup.exe").Length / 1MB
    - echo "Successfully built qimchi-setup.exe ($([math]::Round($installerSize, 2)) MB)"

    # --- Code signing (optional; enable once a cert is in GitLab secure files) -
    # Signs both the bundled exe and the installer for a clean install experience.
    # - |
    #   glab securefile download cert.p12 -o packaging/build/cert.p12
    #   $signtool = Get-Item "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
    #     Sort-Object LastWriteTime -Descending | Select-Object -First 1
    #   & $signtool.FullName sign /fd SHA256 /f packaging/build/cert.p12 /p $SIGN_PASS `
    #     /tr http://timestamp.digicert.com /td SHA256 packaging/build/qimchi/qimchi.exe
    #   & $signtool.FullName sign /fd SHA256 /f packaging/build/cert.p12 /p $SIGN_PASS `
    #     /tr http://timestamp.digicert.com /td SHA256 packaging/build/qimchi-setup.exe
    #   if ($LASTEXITCODE -ne 0) { throw "Failed to sign installer" }
    #   Remove-Item packaging/build/cert.p12 -Force
  artifacts:
    name: "qimchi-windows"
    paths:
      - packaging/build/qimchi-setup.exe
    expire_in: 180 days
  rules:
    # Stable release build on version tags.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: on_success
    # Preview release build on -rc tags (cut from the `preview` branch).
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
      when: on_success
    # Manual ad-hoc build on the preview branch itself (no tag, no release).
    - if: $CI_COMMIT_BRANCH == "preview"
      when: manual
      allow_failure: true

# Builds the self-contained macOS desktop app (PyInstaller + pywebview) via
# scripts/build_macos.sh - produces qimchi.app (bundled by create-dmg into
# qimchi.dmg).  Runs on GitLab's HOSTED SaaS macOS runner
# (saas-macos-large-m2pro, image macos-15-xcode-16) -- no self-hosted Mac
# needed. Note SaaS macOS minutes bill at a higher multiplier, and `release`
# declares `needs: build-macos artifacts: true`, so a macOS failure blocks the
# whole release. Signing is still stubbed (scripts/sign_macos.sh).
build-macos:
  stage: build
  image: macos-15-xcode-16
  tags:
    - saas-macos-large-m2pro
  before_script:
    - |
      # uv for Python dependency management
      curl -LsSf https://astral.sh/uv/install.sh | sh
      export PATH="$HOME/.local/bin:$PATH"

      # Pin Node 22.12 - same constraint as Windows: Vite 8/rolldown needs
      # ^20.19 || >=22.12 and macOS runners often ship an older Node.
      NODE_VER="22.12.0"
      ARCH=$(uname -m)
      NODE_ARCH="darwin-arm64"
      [ "$ARCH" = "x86_64" ] && NODE_ARCH="darwin-x64"
      curl -fsSL "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-${NODE_ARCH}.tar.gz" \
          | tar -xz -C "$HOME"
      export PATH="$HOME/node-v${NODE_VER}-${NODE_ARCH}/bin:$PATH"

      # create-dmg for DMG packaging
      brew install create-dmg

      uv --version
      node --version
      npm --version
  script:
    - VERSION=$(grep 'version[[:space:]]*=' backend/pyproject.toml | sed -E 's/.*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
    - echo "Building Qimchi v$VERSION (pywebview desktop) for macOS"
    - bash scripts/build_macos.sh
    - |
      if [ ! -f "packaging/build/qimchi.dmg" ]; then
        echo "Error: DMG build failed - packaging/build/qimchi.dmg not found"
        exit 1
      fi
    - echo "Successfully built qimchi.dmg ($(du -m packaging/build/qimchi.dmg | cut -f1) MB)"

    # --- Code signing (enable once a Developer ID cert is in GitLab secure files) ---
    # - bash scripts/sign_macos.sh packaging/build/qimchi.app packaging/build/qimchi.dmg
  artifacts:
    name: "qimchi-macos"
    paths:
      - packaging/build/qimchi.dmg
    expire_in: 180 days
  rules:
    # Stable release build on version tags.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: on_success
    # Preview release build on -rc tags (cut from the `preview` branch).
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
      when: on_success
    # Manual ad-hoc build on the preview branch itself (no tag, no release).
    - if: $CI_COMMIT_BRANCH == "preview"
      when: manual
      allow_failure: true

# Builds the self-contained Linux desktop app (PyInstaller + pywebview GTK) via
# scripts/build_linux.sh -- produces qimchi-x86_64.AppImage, a single executable
# that bundles the backend and serves the built SPA in a GTK/WebKit2GTK window.
# Uses GitLab's shared Linux runners (Docker, ubuntu:22.04) -- no special runner
# tag needed.
build-linux:
  stage: build
  tags:
    - saas-linux-2xlarge-amd64
  image: ubuntu:22.04
  before_script:
    - |
      apt-get update -qq
      DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
          python3-pip curl file patchelf squashfs-tools imagemagick \
          libgirepository1.0-dev gcc pkg-config libcairo2-dev \
          gir1.2-gtk-3.0 gir1.2-webkit2-4.0 libwebkit2gtk-4.0-dev
      # uv: install via pip into /usr/local/bin so it is on PATH in script:.
      pip3 install --quiet uv
      # Pin Node 22.12 -- same constraint as Windows/macOS: Vite 8/rolldown needs
      # ^20.19 || >=22.12.  Extract into /usr/local so node/npm land on PATH.
      NODE_VER="22.12.0"
      curl -fsSL "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-linux-x64.tar.gz" \
          | tar -xz -C /usr/local --strip-components=1
      uv --version
      node --version
      npm --version
  script:
    - VERSION=$(grep 'version[[:space:]]*=' backend/pyproject.toml | sed -E 's/.*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
    - echo "Building Qimchi v$VERSION (pywebview desktop) for Linux"
    - bash scripts/build_linux.sh
    - |
      ARCH=$(uname -m)
      if [ ! -f "packaging/build/qimchi-${ARCH}.AppImage" ]; then
        echo "Error: AppImage build failed"
        exit 1
      fi
      echo "Successfully built qimchi-${ARCH}.AppImage ($(du -m packaging/build/qimchi-${ARCH}.AppImage | cut -f1) MB)"
  artifacts:
    name: "qimchi-linux"
    paths:
      - packaging/build/qimchi-*.AppImage
    expire_in: 180 days
  rules:
    # Stable release build on version tags.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: on_success
    # Preview release build on -rc tags (cut from the `preview` branch).
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
      when: on_success
    # Manual ad-hoc build on the preview branch itself (no tag, no release).
    - if: $CI_COMMIT_BRANCH == "preview"
      when: manual
      allow_failure: true

# Single release job: depends on every platform build and attaches all assets to
# ONE GitLab Release. Three separate release jobs each ran `release-cli create`
# for the same tag, which collides ("release already exists"); one job avoids that.
release:
  stage: release
  # Pinned: the :latest image bundles glab, whose wrapper mishandles URL-based
  # assets:links ("stat ...: no such file or directory"). v0.16.0 has no glab, so
  # the runner falls back to the classic release-cli binary.
  image: registry.gitlab.com/gitlab-org/release-cli:v0.16.0
  needs:
    - job: build-windows
      artifacts: true
    - job: build-linux
      artifacts: true
    - job: build-macos
      artifacts: true
  # No `release:` keyword: runner 19.0-pre's keyword generation drops --assets-link
  # (and/or routes through the broken glab wrapper). We call release-cli directly so
  # the asset links actually attach.
  script:
    - |
      # Preview (-rc) tags get a clearly-labelled release. The in-app updater
      # ignores prereleases entirely (api/updater.py::is_prerelease), so these
      # are download-only and are never offered to stable installs.
      case "$CI_COMMIT_TAG" in
        *-rc.*)
          RELEASE_NAME="Qimchi $CI_COMMIT_TAG (preview)"
          PREVIEW_BANNER="**Preview build -- not a stable release.** Expect rough edges. The in-app updater ignores preview builds, so you will not be offered this automatically, nor updated away from it: install stable releases manually."
          ;;
        *)
          RELEASE_NAME="Qimchi $CI_COMMIT_TAG"
          PREVIEW_BANNER=""
          ;;
      esac
      # Release notes (heredoc: $CI_* expand; no backticks present).
      NOTES=$(cat <<EOF
      # Qimchi $CI_COMMIT_TAG

      $PREVIEW_BANNER

      ## Windows
      1. Download qimchi-setup.exe below.
      2. Run the installer -- no administrator rights needed for a per-user install. It creates a Start Menu entry and an optional desktop shortcut.
      - Requires Windows 11 (x64) with the Edge WebView2 runtime (preinstalled).

      ## Linux
      1. Download the qimchi-x86_64.AppImage asset below.
      2. Make it executable and run it from a terminal:
             chmod +x qimchi-x86_64.AppImage
             ./qimchi-x86_64.AppImage
      - Requires x86_64 Linux (kernel 4.4+, glibc 2.31+) and the WebKit2GTK runtime:
        - Ubuntu/Debian: sudo apt-get install libwebkit2gtk-4.0-37
        - Fedora: sudo dnf install webkit2gtk4.0
        - Arch: sudo pacman -S webkit2gtk

      ## macOS
      1. Download qimchi.dmg below.
      2. Open the DMG and drag Qimchi.app to Applications.
      3. On first launch, macOS may require opening it via Control-click -> Open because the app is not notarized yet.
      - Requires Apple Silicon macOS. The current DMG is built on the GitLab macOS M2 Pro runner.

      ## Image export (all platforms)
      For PNG/SVG export, Chrome or Chromium must be installed; if none is found, Qimchi downloads "Chrome for Testing" on first use.

      See the [CHANGELOG](${CI_PROJECT_URL}/-/blob/${CI_COMMIT_TAG}/CHANGELOG.md) and the [commit history](${CI_PROJECT_URL}/-/commits/${CI_COMMIT_TAG}) for what's new.
      EOF
      )
      # delete-then-create makes re-runs idempotent (a pre-existing release would 409).
      release-cli delete --tag-name "$CI_COMMIT_TAG" 2>/dev/null || true
      release-cli create \
        --name "$RELEASE_NAME" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "$NOTES" \
        --assets-link "{\"name\":\"qimchi-x86_64.AppImage (Linux)\",\"url\":\"${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/packaging/build/qimchi-x86_64.AppImage?job=build-linux\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"qimchi-setup.exe (Windows installer)\",\"url\":\"${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/packaging/build/qimchi-setup.exe?job=build-windows\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"qimchi.dmg (macOS)\",\"url\":\"${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/packaging/build/qimchi.dmg?job=build-macos\",\"link_type\":\"package\"}"
  rules:
    # Stable release.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: on_success
    # Preview release (download-only; the updater never offers prereleases).
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
      when: on_success
