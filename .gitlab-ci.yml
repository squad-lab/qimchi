image: "python:3.13"
variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_DRIVER: "overlay2"
  CI_BUILD_ARCHS: linux/amd64 #, linux/arm64
stages:
  - auto_tag_version
  - build
  - release_windows
  - release_macos
  - release_linux

auto_tag_version:
  stage: auto_tag_version
  image: python:3.13-alpine
  before_script:
    - apk add --no-cache git
    - pip3 install toml --break-system-packages
    - git config --global user.name "Janitor"
    - git config --global user.email "squad@fz-juelich.de"
    - git remote set-url origin https://squad_janitor:$CI_FORMAT@$CI_SERVER_HOST/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME
    - git fetch
    - git checkout $CI_COMMIT_REF_NAME
    - git reset --hard origin/$CI_COMMIT_REF_NAME
    - git pull --rebase
  script:
    # Extract current version from pyproject.toml
    - |
      python3 << 'EOF'
      import toml
      data = toml.load('backend/pyproject.toml')
      version = data['project']['version']
      with open('current_version.txt', 'w') as f:
          f.write(version)
      print(f"Current version: {version}")
      EOF
    - export CURRENT_VERSION=$(cat current_version.txt)
    - echo "Current version in pyproject.toml is v$CURRENT_VERSION"

    # Check if this version tag already exists
    - git fetch --tags
    - |
      if git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; then
        echo "Tag v$CURRENT_VERSION already exists, skipping tag creation"
        exit 0
      fi

    # Check if version line was changed in this commit
    - |
      # Check if this is the first commit (no parent)
      if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
        echo "First commit detected - creating initial tag v$CURRENT_VERSION"
        git tag -a "v$CURRENT_VERSION" -m "Release version $CURRENT_VERSION"
        git push origin "v$CURRENT_VERSION"
        echo "Successfully created initial tag v$CURRENT_VERSION"
        exit 0
      fi

      # Check if version line was changed in this commit
      if git diff HEAD~1 HEAD -- backend/pyproject.toml | grep -E '^\+[[:space:]]*version[[:space:]]*='; then
        echo "Version was updated in this commit, creating tag v$CURRENT_VERSION"

        # Create and push the tag
        git tag -a "v$CURRENT_VERSION" -m "Release version $CURRENT_VERSION"
        git push origin "v$CURRENT_VERSION"

        echo "Successfully created and pushed tag v$CURRENT_VERSION"
      else
        echo "Version line was not changed in this commit, skipping tag creation"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  #     changes:
  #       - backend/pyproject.toml
  # allow_failure: false

docker:
  image: jonoh/docker-buildx-qemu
  stage: build
  services:
    - docker:28-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --driver docker-container --use
    - docker buildx inspect --bootstrap
  script:
    - VERSION=$(grep '^[[:space:]]*version[[:space:]]*=' backend/pyproject.toml | sed -E 's/.*version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/')
    - update-binfmts --enable
    - docker buildx build --platform $CI_BUILD_ARCHS --progress plain --pull -t "$CI_REGISTRY/squad-lab/qimchi:latest" -t "$CI_REGISTRY/squad-lab/qimchi:$VERSION" --push .
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: on_success

# Builds the self-contained Windows desktop app (PyInstaller + pywebview) via
# build_local.ps1 -- a single qimchi.exe that bundles the backend and serves the
# built SPA in a native window. Replaces the old qimchi.bat-wrapper exe.
build-windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  before_script:
    # uv manages Python 3.13 + all backend deps.
    - powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
    - $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
    # The runner's preinstalled Node is 21.7.3, which Vite 8/rolldown reject
    # (engines: ^20.19 || >=22.12). On 21.x npm SKIPS rolldown's native binding
    # and `vite build` crashes. Pin a supported Node, fetched via preinstalled curl.
    - $nodeVer = "22.12.0"
    - curl.exe -fsSL -o "$env:TEMP\node.zip" "https://nodejs.org/dist/v$nodeVer/node-v$nodeVer-win-x64.zip"
    - Expand-Archive "$env:TEMP\node.zip" -DestinationPath "$env:CI_PROJECT_DIR\.node" -Force
    - $env:Path = "$env:CI_PROJECT_DIR\.node\node-v$nodeVer-win-x64;$env:Path"
    # Inno Setup 6 — builds the Windows installer after PyInstaller.
    # Chocolatey is preinstalled on the SaaS Windows runner.
    - choco install innosetup --yes --no-progress
    - $env:Path = "$env:ProgramFiles\Inno Setup 6;$env:Path"
    - uv --version
    - node --version
    - npm --version
    # Verify Inno Setup is on PATH. Don't run `ISCC.exe /?` -- it prints its
    # usage banner and exits 1 (no script file given), which the PowerShell
    # executor treats as a failed step.
    - (Get-Command ISCC.exe).Source
  script:
    - $VERSION = (Select-String -Path "backend/pyproject.toml" -Pattern 'version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
    - echo "Building Qimchi v$VERSION (pywebview desktop) for Windows"
    # build_local.ps1 handles everything:
    #   1. Frontend build (npm)
    #   2. Backend staging
    #   3. fd.exe download → vendor/fd-windows/fd.exe
    #   4. backend/.venv setup (datasets extra + PyInstaller + pywebview + pythonnet)
    #   5. PyInstaller onedir build → packaging/build/qimchi/
    #   6. Inno Setup installer → packaging/build/qimchi-setup.exe
    - ./build_local.ps1
    - if (!(Test-Path "packaging/build/qimchi-setup.exe")) { throw "Installer build failed" }
    - $installerSize = (Get-Item "packaging/build/qimchi-setup.exe").Length / 1MB
    - echo "Successfully built qimchi-setup.exe ($([math]::Round($installerSize, 2)) MB)"

    # --- Code signing (optional; enable once a cert is in GitLab secure files) -
    # Signs both the bundled exe and the installer for a clean install experience.
    # - |
    #   glab securefile download cert.p12 -o packaging/build/cert.p12
    #   $signtool = Get-Item "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
    #     Sort-Object LastWriteTime -Descending | Select-Object -First 1
    #   & $signtool.FullName sign /fd SHA256 /f packaging/build/cert.p12 /p $SIGN_PASS `
    #     /tr http://timestamp.digicert.com /td SHA256 packaging/build/qimchi/qimchi.exe
    #   & $signtool.FullName sign /fd SHA256 /f packaging/build/cert.p12 /p $SIGN_PASS `
    #     /tr http://timestamp.digicert.com /td SHA256 packaging/build/qimchi-setup.exe
    #   if ($LASTEXITCODE -ne 0) { throw "Failed to sign installer" }
    #   Remove-Item packaging/build/cert.p12 -Force
  artifacts:
    name: "qimchi-windows"
    paths:
      - packaging/build/qimchi-setup.exe
    expire_in: 180 days
  rules:
    # Release build on version tags...
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: on_success
    # ...and a manual build on the packaging branch for testing the pipeline.
    - if: $CI_COMMIT_BRANCH == "packaging"
      when: manual
      allow_failure: true

# Builds the self-contained macOS desktop app (PyInstaller + pywebview) via
# scripts/build_macos.sh — produces qimchi.app (bundled by create-dmg into
# qimchi.dmg).  Requires a self-hosted macOS runner tagged "macos".
# Kept as when:manual until a runner is validated and signing is set up.
build-macos:
  stage: build
  tags:
    - macos
  before_script:
    - |
      # uv for Python dependency management
      curl -LsSf https://astral.sh/uv/install.sh | sh
      export PATH="$HOME/.local/bin:$PATH"

      # Pin Node 22.12 — same constraint as Windows: Vite 8/rolldown needs
      # ^20.19 || >=22.12 and macOS runners often ship an older Node.
      NODE_VER="22.12.0"
      ARCH=$(uname -m)
      NODE_ARCH="darwin-arm64"
      [ "$ARCH" = "x86_64" ] && NODE_ARCH="darwin-x64"
      curl -fsSL "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-${NODE_ARCH}.tar.gz" \
          | tar -xz -C "$HOME"
      export PATH="$HOME/node-v${NODE_VER}-${NODE_ARCH}/bin:$PATH"

      # create-dmg for DMG packaging
      brew install create-dmg

      uv --version
      node --version
      npm --version
  script:
    - VERSION=$(grep 'version[[:space:]]*=' backend/pyproject.toml | sed -E 's/.*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
    - echo "Building Qimchi v$VERSION (pywebview desktop) for macOS"
    - bash scripts/build_macos.sh
    - |
      if [ ! -f "packaging/build/qimchi.dmg" ]; then
        echo "Error: DMG build failed — packaging/build/qimchi.dmg not found"
        exit 1
      fi
    - echo "Successfully built qimchi.dmg ($(du -m packaging/build/qimchi.dmg | cut -f1) MB)"

    # --- Code signing (enable once a Developer ID cert is in GitLab secure files) ---
    # - bash scripts/sign_macos.sh packaging/build/qimchi.app packaging/build/qimchi.dmg
  artifacts:
    name: "qimchi-macos"
    paths:
      - packaging/build/qimchi.dmg
    expire_in: 180 days
  rules:
    # Release build on version tags (manual until a runner is validated).
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
      allow_failure: true
    # Manual test build on the packaging branch.
    - if: $CI_COMMIT_BRANCH == "packaging"
      when: manual
      allow_failure: true

release_macos:
  stage: release_macos
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-macos
      artifacts: true
  script:
    - echo "Attaching macOS DMG to release $CI_COMMIT_TAG"
    - VERSION=${CI_COMMIT_TAG#v}
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Qimchi $CI_COMMIT_TAG"
    description: |-
      ### macOS Installation
      1. Download `qimchi.dmg` and open it.
      2. Drag **Qimchi.app** to the **Applications** folder.
      3. On first launch, right-click → Open to bypass Gatekeeper (unsigned build).

      For PNG/SVG export, Chrome or Chromium must be installed; if none is found
      Qimchi downloads "Chrome for Testing" on first use.

      ### Requirements
      - macOS 12 Monterey or later (arm64 or x86_64)
      - WebKit is built into macOS — no extra runtime needed

      See the [CHANGELOG](${CI_PROJECT_URL}/-/blob/${CI_COMMIT_TAG}/CHANGELOG.md) for what's new.
    assets:
      links:
        - name: "qimchi.dmg (macOS)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/packaging/build/qimchi.dmg?job=build-macos"
          link_type: "package"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
      allow_failure: true

# Builds the self-contained Linux desktop app (PyInstaller + pywebview GTK) via
# scripts/build_linux.sh -- produces qimchi-x86_64.AppImage, a single executable
# that bundles the backend and serves the built SPA in a GTK/WebKit2GTK window.
# Uses GitLab's shared Linux runners (Docker, ubuntu:22.04) -- no special runner
# tag needed.
build-linux:
  stage: build
  image: ubuntu:22.04
  before_script:
    - |
      apt-get update -qq
      DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
          python3-pip curl file patchelf squashfs-tools imagemagick \
          libgirepository1.0-dev gcc pkg-config libcairo2-dev \
          gir1.2-gtk-3.0 gir1.2-webkit2-4.0 libwebkit2gtk-4.0-dev
      # uv: install via pip into /usr/local/bin so it is on PATH in script:.
      pip3 install --quiet uv
      # Pin Node 22.12 -- same constraint as Windows/macOS: Vite 8/rolldown needs
      # ^20.19 || >=22.12.  Extract into /usr/local so node/npm land on PATH.
      NODE_VER="22.12.0"
      curl -fsSL "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-linux-x64.tar.gz" \
          | tar -xz -C /usr/local --strip-components=1
      uv --version
      node --version
      npm --version
  script:
    - VERSION=$(grep 'version[[:space:]]*=' backend/pyproject.toml | sed -E 's/.*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
    - echo "Building Qimchi v$VERSION (pywebview desktop) for Linux"
    - bash scripts/build_linux.sh
    - |
      ARCH=$(uname -m)
      if [ ! -f "packaging/build/qimchi-${ARCH}.AppImage" ]; then
        echo "Error: AppImage build failed"
        exit 1
      fi
      echo "Successfully built qimchi-${ARCH}.AppImage ($(du -m packaging/build/qimchi-${ARCH}.AppImage | cut -f1) MB)"
  artifacts:
    name: "qimchi-linux"
    paths:
      - packaging/build/qimchi-*.AppImage
    expire_in: 180 days
  rules:
    # Release build on version tags.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: on_success
    # Manual test build on the packaging branch.
    - if: $CI_COMMIT_BRANCH == "packaging"
      when: manual
      allow_failure: true

release_linux:
  stage: release_linux
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-linux
      artifacts: true
  script:
    - echo "Attaching Linux AppImage to release $CI_COMMIT_TAG"
    - VERSION=${CI_COMMIT_TAG#v}
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Qimchi $CI_COMMIT_TAG"
    description: |-
      ### Linux Installation
      1. Download `qimchi-x86_64.AppImage` below.
      2. Make it executable and run it:
         ```
         chmod +x qimchi-x86_64.AppImage
         ./qimchi-x86_64.AppImage
         ```

      ### Requirements
      - x86_64 Linux (kernel 4.4+, glibc 2.31+)
      - WebKit2GTK runtime (pywebview GTK backend):
        - Ubuntu/Debian: `sudo apt-get install libwebkit2gtk-4.0-37`
        - Fedora: `sudo dnf install webkit2gtk4.0`
        - Arch: `sudo pacman -S webkit2gtk`
      - For PNG/SVG export: Chrome or Chromium installed; if none is found
        Qimchi downloads "Chrome for Testing" on first use.

      See the [CHANGELOG](${CI_PROJECT_URL}/-/blob/${CI_COMMIT_TAG}/CHANGELOG.md) for what's new.
    assets:
      links:
        - name: "qimchi-x86_64.AppImage (Linux)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/packaging/build/qimchi-x86_64.AppImage?job=build-linux"
          link_type: "package"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: on_success

release_windows:
  stage: release_windows
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-windows
      artifacts: true
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
    - VERSION=${CI_COMMIT_TAG#v}
    - echo "Version is $VERSION"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Qimchi $CI_COMMIT_TAG"
    description: |-
      # Qimchi $CI_COMMIT_TAG - Windows Release

      ### Installation
      1. Download `qimchi-setup.exe` above or click [here](${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/packaging/build/qimchi-setup.exe?job=build-windows).
      2. Run the installer — no administrator rights needed for a per-user install.
         It creates a Start Menu entry and an optional desktop shortcut.

      ### Linux/macOS Installation
      For Linux and macOS users, please see the [Docker Installation](${CI_PROJECT_URL}/-/blob/main/README.md#linuxmacos-docker-installation) or [Expert Installation](${CI_PROJECT_URL}/-/blob/main/README.md#expert-installation) instructions in the README.

      ### What's New
      See the [CHANGELOG](${CI_PROJECT_URL}/-/blob/${CI_COMMIT_TAG}/CHANGELOG.md) and the [commit history](${CI_PROJECT_URL}/-/commits/${CI_COMMIT_TAG}).

      ### Requirements
      - Windows 11 (x64) with the Edge WebView2 runtime (preinstalled).
      - For PNG/SVG image export: a Chrome/Chromium. If none is found, Qimchi downloads "Chrome for Testing" once on first use.
    assets:
      links:
        - name: "qimchi-setup.exe (Windows installer)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/packaging/build/qimchi-setup.exe?job=build-windows"
          link_type: "package"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: on_success
