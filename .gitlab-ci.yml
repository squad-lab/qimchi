image: "python:3.13"
variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_DRIVER: "overlay2"
  CI_BUILD_ARCHS: linux/amd64 #, linux/arm64
stages:
  - auto_tag_version
  - build
  - release_windows

auto_tag_version:
  stage: auto_tag_version
  image: python:3.13-alpine
  before_script:
    - apk add --no-cache git
    - pip3 install toml --break-system-packages
    - git config --global user.name "Janitor"
    - git config --global user.email "squad@fz-juelich.de"
    - git remote set-url origin https://squad_janitor:$CI_FORMAT@$CI_SERVER_HOST/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME
    - git fetch
    - git checkout $CI_COMMIT_REF_NAME
    - git reset --hard origin/$CI_COMMIT_REF_NAME
    - git pull --rebase
  script:
    # Extract current version from pyproject.toml
    - |
      python3 << 'EOF'
      import toml
      data = toml.load('backend/pyproject.toml')
      version = data['project']['version']
      with open('current_version.txt', 'w') as f:
          f.write(version)
      print(f"Current version: {version}")
      EOF
    - export CURRENT_VERSION=$(cat current_version.txt)
    - echo "Current version in pyproject.toml is v$CURRENT_VERSION"
    
    # Check if this version tag already exists
    - git fetch --tags
    - |
      if git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; then
        echo "Tag v$CURRENT_VERSION already exists, skipping tag creation"
        exit 0
      fi
    
    # Check if version line was changed in this commit
    - |
      # Check if this is the first commit (no parent)
      if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
        echo "First commit detected - creating initial tag v$CURRENT_VERSION"
        git tag -a "v$CURRENT_VERSION" -m "Release version $CURRENT_VERSION"
        git push origin "v$CURRENT_VERSION"
        echo "Successfully created initial tag v$CURRENT_VERSION"
        exit 0
      fi
      
      # Check if version line was changed in this commit
      if git diff HEAD~1 HEAD -- backend/pyproject.toml | grep -E '^\+[[:space:]]*version[[:space:]]*='; then
        echo "Version was updated in this commit, creating tag v$CURRENT_VERSION"
        
        # Create and push the tag
        git tag -a "v$CURRENT_VERSION" -m "Release version $CURRENT_VERSION"
        git push origin "v$CURRENT_VERSION"
        
        echo "Successfully created and pushed tag v$CURRENT_VERSION"
      else
        echo "Version line was not changed in this commit, skipping tag creation"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  #     changes:
  #       - backend/pyproject.toml
  # allow_failure: false

docker:
  image: jonoh/docker-buildx-qemu
  stage: build
  services:
    - docker:28-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --driver docker-container --use
    - docker buildx inspect --bootstrap
  script:
    - VERSION=$(grep '^[[:space:]]*version[[:space:]]*=' backend/pyproject.toml | sed -E 's/.*version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/')
    - update-binfmts --enable
    - docker buildx build --platform $CI_BUILD_ARCHS --progress plain --pull -t "$CI_REGISTRY/squad-lab/qimchi:latest" -t "$CI_REGISTRY/squad-lab/qimchi:$VERSION" --push .
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: on_success

build_qimchi_exe:
  stage: build
  tags:
    - saas-windows-medium-amd64
  script:
    # Extract version from pyproject.toml
    - $VERSION = (Select-String -Path "backend/pyproject.toml" -Pattern 'version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
    - echo "Building Qimchi v$VERSION for Windows"
    
    # Create build directory
    - New-Item -ItemType Directory -Force -Path packaging/build
    
    # Copy batch file and icon to build directory
    - Copy-Item qimchi.bat packaging/build/
    - Copy-Item frontend/public/qimchi-logo.ico packaging/build/
    
    # Create a Python wrapper that calls the batch file
    - |
      $pythonWrapper = @'
      import subprocess
      import sys
      import os
      
      # Get the directory where the exe is located
      exe_dir = os.path.dirname(sys.executable)
      
      if getattr(sys, 'frozen', False):
          # Running as compiled exe - PyInstaller extracts to sys._MEIPASS temp directory
          bundle_dir = sys._MEIPASS
          bat_path = os.path.join(bundle_dir, "qimchi.bat")
      else:
          # Running as script
          bundle_dir = os.path.dirname(os.path.abspath(__file__))
          bat_path = os.path.join(bundle_dir, "qimchi.bat")
      
      if os.path.exists(bat_path):
          print(f"Found batch file at: {bat_path}")
          print(f"Running from exe directory: {exe_dir}")
          # Run the batch file with exe directory as working directory
          result = subprocess.run([bat_path], shell=True, cwd=exe_dir)
          sys.exit(result.returncode)
      else:
          print(f"ERROR: qimchi.bat not found!")
          print(f"Searched in bundle directory: {bundle_dir}")
          print(f"Exe directory: {exe_dir}")
          print(f"sys._MEIPASS: {getattr(sys, '_MEIPASS', 'Not available')}")
          if os.path.exists(bundle_dir):
              print(f"Bundle directory contents: {os.listdir(bundle_dir)}")
          input("Press Enter to exit...")
          sys.exit(1)
      '@
      $pythonWrapper | Out-File -FilePath "packaging/build/qimchi_launcher.py" -Encoding UTF8
    
    # Install PyInstaller
    - python -m pip install pyinstaller
    
    # Build EXE with PyInstaller, bundling the batch file
    - $iconPath = Join-Path (Get-Location) "packaging\build\qimchi-logo.ico"
    - $batPath = Join-Path (Get-Location) "qimchi.bat"
    - python -m PyInstaller --onefile --console --icon="$iconPath" --add-data "${batPath};." --name="qimchi" --distpath="packaging/build" --workpath="packaging/build/pyinstaller_work" --specpath="packaging/build" "packaging/build/qimchi_launcher.py"
    
    # Verify EXE was created
    - if (!(Test-Path "packaging/build/qimchi.exe")) { throw "EXE build failed" }
    - $exeSize = (Get-Item "packaging/build/qimchi.exe").Length / 1MB
    - echo "Successfully built qimchi.exe ($([math]::Round($exeSize, 2)) MB)"
    
  artifacts:
    name: "qimchi-v$VERSION-windows"
    paths:
      - packaging/build/qimchi.exe
      - packaging/build/qimchi.bat
    expire_in: 180 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: on_success

release_windows:
  stage: release_windows
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_qimchi_exe
      artifacts: true
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
    - VERSION=${CI_COMMIT_TAG#v}
    - echo "Version is $VERSION"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Qimchi $CI_COMMIT_TAG"
    description: |
      # <img src="https://gitlab.com/squad-lab/qimchi/-/raw/main/frontend/public/qimchi-logo.png" alt="Qimchi Logo" width="25" style="vertical-align: middle;"/> Qimchi $CI_COMMIT_TAG - Windows Release
      
      ### Installation
      1. Download `qimchi.exe` above or click [here](${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/packaging/build/qimchi.exe?job=build_qimchi_exe).
      2. Double-click to run the installer.
      3. Access the web interface at http://localhost:8001.
      
      ### Linux/macOS Installation
      For Linux and macOS users, please see the [Docker Installation](${CI_PROJECT_URL}/-/blob/main/README.md#linuxmacos-docker-installation) or [Expert Installation](${CI_PROJECT_URL}/-/blob/main/README.md#expert-installation) instructions in the README.
      
      ### What's New
      See the [commit history](${CI_PROJECT_URL}/-/commits/${CI_COMMIT_TAG}) for changes in this release.
      
      ### Requirements
      - Windows 11 24H2+ with winget installed
      - Internet connection for first-time setup
    assets:
      links:
        - name: "qimchi.exe (Windows Installer)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/packaging/build/qimchi.exe?job=build_qimchi_exe"
          link_type: "package"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: on_success
